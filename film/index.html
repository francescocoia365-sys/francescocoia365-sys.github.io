<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12122b">
<title>Last Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Sala giochi 8 bit, ma ordinata: fondo fermo, un colore per azione, il caos sta solo nelle esplosioni. */
:root{
  color-scheme:dark;
  --bg:#12122b; --panel:#1c1c42; --line:#35356e;
  --ink:#f3f1ff; --muted:#a7a4d4;
  --yellow:#ffd23f; --pink:#ff4d8d; --cyan:#4de2ff;
  --f-d:"Pixelify Sans","Courier New",monospace;
  --f-b:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.3;-webkit-user-select:none;user-select:none;touch-action:manipulation;
  background-image:radial-gradient(#ffffff12 1px,transparent 1.5px);background-size:16px 16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
[hidden]{display:none!important}

.app{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:880px;margin:0 auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px))}
.schermo{display:none;flex:1;min-height:0;flex-direction:column;gap:12px}
body[data-s="lista"] #lista,body[data-s="arena"] #arena,body[data-s="hall"] #hall{display:flex}

/* testata */
.testa{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--f-d);font-weight:700;font-size:1.7rem;line-height:1;margin:0;letter-spacing:.02em}
h1 i{font-style:normal;color:var(--yellow)}
.link{font-family:var(--f-d);font-weight:500;font-size:1rem;color:var(--muted);padding:10px 4px;min-height:44px}
.link b{color:var(--yellow);font-weight:700}
.sub{margin:0;color:var(--muted);font-size:.92rem}
.sub b{color:var(--ink);font-weight:700}

/* bottoni */
.btn{font-family:var(--f-d);font-weight:700;font-size:1.25rem;line-height:1;display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:58px;padding:0 16px;border-radius:8px;color:#17172f;background:var(--ink);box-shadow:0 5px 0 #0007;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0007}
.btn.y{background:var(--yellow)} .btn.c{background:var(--cyan)} .btn.p{background:var(--pink);color:#fff}
.btn.xl{min-height:66px;font-size:1.5rem;width:100%}
.btn.q{width:58px;flex:none;padding:0;background:var(--panel);color:var(--ink);box-shadow:0 5px 0 #0007,inset 0 0 0 2px var(--line)}
.btn.fermo{filter:saturate(.35) brightness(.75)}
.btn.no,.mini.no{animation:no .3s steps(4)}
@keyframes no{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.btn svg{width:26px;height:26px;flex:none}
.mini{font-weight:500;font-size:.9rem;padding:0 12px;min-height:44px;border-radius:8px;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);color:var(--ink)}
.mini b{color:var(--yellow);font-weight:700}
.mini[aria-pressed="true"]{background:var(--cyan);color:#10203a;box-shadow:none}
.riga{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dock{display:grid;gap:12px}
.dock .due{display:flex;gap:10px}
.dock .due .btn.c{flex:1;min-width:0}
#mic-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mic.on{background:var(--pink);color:#fff;animation:rec .8s steps(2) infinite}
@keyframes rec{50%{box-shadow:0 5px 0 #0007,0 0 0 6px #ff4d8d55}}

/* griglia wishlist */
#griglia{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;align-content:start;
  list-style:none;margin:0;padding:2px;-webkit-overflow-scrolling:touch}
@media(min-width:600px){#griglia{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px}}
.vuoto{grid-column:1/-1;margin:0;padding:34px 16px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:8px}

/* locandina */
.film{position:relative;display:block;width:100%;container-type:inline-size;text-align:left}
.poster{position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--g,#333);box-shadow:0 0 0 2px var(--ink),0 5px 0 #0007;
  display:flex;align-items:center;justify-content:center}
.poster img,.poster canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.poster canvas{image-rendering:pixelated;z-index:2}
.poster .t{font-family:var(--f-d);font-weight:700;font-size:calc(var(--ts,14)*1cqw);line-height:1;text-align:center;padding:6cqw;color:#fff;overflow-wrap:anywhere}
.poster.ok .t{display:none}
.poster .cap{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:12cqw 5cqw 4cqw;font-weight:500;font-size:max(10px,8cqw);line-height:1.1;text-align:center;
  background:linear-gradient(transparent,#000d 60%);display:none;overflow-wrap:anywhere}
.poster.ok .cap{display:block}
.poster.carica::after{content:"";position:absolute;inset:0;z-index:3;background:repeating-linear-gradient(90deg,#fff3 0 8px,transparent 8px 16px);animation:carica .5s steps(2) infinite}
@keyframes carica{to{background-position:8px 0}}
.film.nuovo{animation:pop .3s steps(5) backwards}
@keyframes pop{from{transform:scale(0)}}

/* arena */
#conta{font-family:var(--f-d);font-weight:700;text-align:center;font-size:1.6rem;line-height:1;margin:0;min-height:1em}
#conta b{color:var(--yellow)}
#campo{flex:1;min-height:0;position:relative}
#ring{position:absolute;inset:0;display:grid;justify-content:center;align-content:center;gap:10px}
#ring .film{transition:opacity .12s,filter .12s}
#ring.gira .film:not(.mira):not(.sfida):not(.trema){opacity:.3;filter:saturate(.3)}
#ring .film.mira{z-index:3;transform:scale(1.08)}
#ring .film.mira .poster{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--pink);animation:cursore .2s steps(2) infinite}
@keyframes cursore{50%{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--yellow)}}
#ring.salva .film.mira .poster{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--cyan);animation:cursore2 .2s steps(2) infinite}
@keyframes cursore2{50%{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--ink)}}
#ring .film.trema{z-index:4;animation:trema .12s steps(2) infinite}
#ring .film.trema .poster{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--pink)}
@keyframes trema{0%{transform:translate(-4px,2px) scale(1.12)}100%{transform:translate(4px,-2px) scale(1.12)}}
.app.botta{animation:botta .32s steps(6)}
@keyframes botta{20%{transform:translate(-10px,6px)}40%{transform:translate(10px,-8px)}60%{transform:translate(-6px,4px)}80%{transform:translate(4px,-2px)}}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none;image-rendering:pixelated}
#flash{position:fixed;inset:0;z-index:20;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:flash .3s steps(4)}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
#ko{position:fixed;left:0;right:0;top:36%;z-index:41;text-align:center;pointer-events:none;padding:0 12px;display:none}
#ko.on{display:block;animation:ko 1.2s steps(10) both}
#ko .k1{display:block;font-family:var(--f-d);font-weight:700;font-size:clamp(4rem,24vw,8rem);line-height:.85;color:var(--yellow);text-shadow:6px 6px 0 var(--pink),10px 10px 0 #000}
#ko .k2{display:inline-block;margin-top:16px;background:#000;color:#fff;font-weight:500;font-size:1.05rem;padding:6px 12px;border-radius:4px;max-width:100%;overflow-wrap:anywhere}
@keyframes ko{0%{transform:scale(3);opacity:0}15%{transform:scale(1);opacity:1}85%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));z-index:45;transform:translate(-50%,-200%);max-width:92vw;font-weight:500;text-align:center;
  background:var(--ink);color:#17172f;padding:11px 16px;border-radius:8px;box-shadow:0 5px 0 #0007;pointer-events:none;overflow-wrap:anywhere}
#toast b{font-weight:700}
#toast.on{animation:toast 2.2s steps(14) both}
@keyframes toast{0%{transform:translate(-50%,-200%)}10%,85%{transform:translate(-50%,0)}100%{transform:translate(-50%,-200%)}}

/* fogli */
.velo{position:fixed;inset:0;z-index:37;background:#0b0b1dd9;display:flex;align-items:flex-end;justify-content:center}
.foglio{width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:var(--panel);border-radius:12px 12px 0 0;box-shadow:0 -2px 0 var(--line);
  padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.foglio .su{display:flex;gap:14px;align-items:center}
.foglio .su .mostra{width:84px;flex:none;container-type:inline-size}
.foglio h2{font-family:var(--f-d);font-weight:700;font-size:1.35rem;line-height:1.05;margin:0;overflow-wrap:anywhere}
.foglio .btn{width:100%;font-size:1.1rem;min-height:52px}
.foglio .btn.s{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
#rip-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;padding:2px}
#scrivi{position:fixed;left:0;right:0;top:0;z-index:38;background:var(--panel);box-shadow:0 2px 0 var(--line),0 0 0 100vmax #0b0b1dd9;
  padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;display:flex;gap:8px}
#q{flex:1;min-width:0;font:inherit;font-weight:500;font-size:1.1rem;color:#17172f;background:var(--ink);border:0;border-radius:8px;padding:0 14px;min-height:52px;
  -webkit-user-select:text;user-select:text}
#q::placeholder{color:#7b78a8}
#scrivi .btn{min-height:52px;font-size:1.05rem}

/* vincitore */
#vince{position:fixed;inset:0;z-index:35;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);
  padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(16px + env(safe-area-inset-bottom,0px))}
body.finale #vince{display:flex}
.v1{font-family:var(--f-d);font-weight:500;font-size:1.2rem;margin:0;color:var(--cyan);letter-spacing:.08em;text-transform:uppercase}
#vposter{width:min(60vw,36vh,300px);container-type:inline-size}
#vposter .poster{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--yellow),0 12px 0 #0008}
#vtit{font-family:var(--f-d);font-weight:700;font-size:clamp(1.7rem,8vw,2.8rem);line-height:1;margin:0;text-align:center;color:var(--yellow);overflow-wrap:anywhere;max-width:100%}
#vince .btn.xl{max-width:420px}

/* hall of fame */
#albo{flex:1;min-height:0;overflow-y:auto;list-style:none;margin:0;padding:2px;display:grid;gap:10px;align-content:start}
#albo li{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:8px;padding:10px;box-shadow:inset 0 0 0 2px var(--line)}
#albo li.vuoto{display:block;background:none;box-shadow:none}
#albo .mostra{width:54px;flex:none;container-type:inline-size}
#albo .mostra .cap{display:none!important}
#albo .chi{flex:1;min-width:0}
#albo .chi strong{display:block;font-weight:700;overflow-wrap:anywhere}
#albo .chi span{color:var(--muted);font-size:.86rem}
#albo .chi span b{color:var(--yellow);font-weight:500}
#albo button{width:44px;height:44px;border-radius:8px;flex:none;font-size:1.1rem;color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body data-s="lista">

<div class="app" id="app">
  <section class="schermo" id="lista">
    <div class="testa">
      <h1>LAST <i>REEL</i></h1>
      <button class="link" id="apri-hall" type="button">Hall of Fame <b id="n-hall"></b></button>
    </div>
    <p class="sub" id="dritta"></p>
    <ul id="griglia"></ul>
    <div class="dock">
      <div class="due">
        <button class="btn c" id="mic" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 2h6v12H9zM5 10h2v4h2v2h6v-2h2v-4h2v6h-2v2h-4v2h4v2H7v-2h4v-2H7v-2H5z"/></svg>
          <span id="mic-t">Dì un film</span>
        </button>
        <button class="btn q" id="tast" type="button" aria-label="Scrivi con la tastiera">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 5h20v14H2zm2 2v10h16V7zm2 2h2v2H6zm4 0h2v2h-2zm4 0h2v2h-2zM6 13h12v2H6z" fill-rule="evenodd"/></svg>
        </button>
      </div>
      <button class="btn y xl" id="via" type="button">Scegli</button>
    </div>
  </section>

  <section class="schermo" id="arena">
    <p id="conta" aria-live="polite"></p>
    <div id="campo"><div id="ring"></div></div>
    <button class="btn p xl" id="fuori" type="button">Fuori uno</button>
    <div class="riga">
      <button class="mini" id="modo" type="button"></button>
      <button class="mini" id="auto" type="button" aria-pressed="false">Auto</button>
      <button class="mini" id="ripesca" type="button">Ripesca</button>
      <button class="mini" id="suono" type="button" aria-pressed="true">Suoni</button>
      <button class="mini" id="indietro" type="button">Esci</button>
    </div>
  </section>

  <section class="schermo" id="hall">
    <div class="testa">
      <h1>HALL OF <i>FAME</i></h1>
      <button class="link" id="chiudi-hall" type="button">Indietro</button>
    </div>
    <p class="sub">I film che avete visto, dal più recente.</p>
    <ul id="albo"></ul>
  </section>
</div>

<form id="scrivi" autocomplete="off" hidden>
  <input id="q" type="text" enterkeyhint="send" placeholder="Titolo, oppure: con Margot Robbie" aria-label="Titolo del film o attore">
  <button class="btn c" type="submit">Vai</button>
  <button class="btn q" id="scrivi-x" type="button" aria-label="Chiudi">✕</button>
</form>

<div class="velo" id="velo" hidden>
  <div class="foglio" role="dialog" aria-modal="true" aria-labelledby="f-tit">
    <div class="su"><div class="mostra" id="f-poster"></div><h2 id="f-tit"></h2></div>
    <button class="btn y" id="f-visto" type="button">Già visto: in Hall of Fame</button>
    <button class="btn s" id="f-cover" type="button">Copertina sbagliata: cambiala</button>
    <button class="btn s" id="f-via" type="button">Togli dalla wishlist</button>
    <button class="btn s" id="f-chiudi" type="button">Chiudi</button>
  </div>
</div>

<div class="velo" id="velo-rip" hidden>
  <div class="foglio" role="dialog" aria-modal="true" aria-labelledby="rip-tit">
    <h2 id="rip-tit">Chi ripeschi?</h2>
    <p class="sub">Torna in gara e sfida il vincitore in un duello secco. Vale una volta sola.</p>
    <div id="rip-lista"></div>
    <button class="btn s" id="rip-no" type="button">Lascia stare</button>
  </div>
</div>

<div id="vince" role="dialog" aria-modal="true" aria-labelledby="vtit">
  <p class="v1">Stasera si guarda</p>
  <div id="vposter"></div>
  <h2 id="vtit"></h2>
  <button class="btn y xl" id="v-ok" type="button">Lo guardiamo</button>
  <div class="riga">
    <button class="mini" id="v-rip" type="button">Ripescaggio</button>
    <button class="mini" id="v-riv" type="button">Rivincita</button>
    <button class="mini" id="v-no" type="button">Non stasera</button>
  </div>
</div>

<div id="ko"><span class="k1">K.O.</span><span class="k2" id="ko-t"></span></div>
<div id="toast" role="status"></div>
<div id="flash"></div>
<canvas id="fx"></canvas>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var KEY="ne-restera-uno/v2";
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
function rand(n){var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function mescola(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rand(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
var calmo=matchMedia("(prefers-reduced-motion:reduce)").matches;
var MAX=8, PESCA=6;
var films=[], hall=[], suoni=true, modo="roulette";
/* Partita: `vivi` chi è in gara, `eliminati` l'ordine di uscita (lo usa il ripescaggio),
   `banco` la rosa di un attore quando la partita non viene dalla wishlist. */
var vivi=[], eliminati=[], banco=null, busy=false, auto=false, ripescato=false, uid=0;

/* ---------- memoria ---------- */
function salva(){try{localStorage.setItem(KEY,JSON.stringify({films:films,hall:hall,suoni:suoni,modo:modo}))}catch(e){}}
function carica(){try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s){
  if(Array.isArray(s.films))films=s.films.map(function(f){f.loading=false;return f});
  if(Array.isArray(s.hall))hall=s.hall;suoni=s.suoni!==false;if(s.modo)modo=s.modo}}catch(e){}}

/* ---------- titoli e copertine ---------- */
var PICCOLE="il lo la i gli le un uno una di a da in con su per tra fra e ed o del della dei degli delle al alla the of and to".split(" ");
function bello(t){return t.trim().replace(/\s+/g," ").toLowerCase().split(" ").map(function(w,i){return (i&&PICCOLE.indexOf(w)>=0)?w:w.charAt(0).toUpperCase()+w.slice(1)}).join(" ")}
function norm(t){return String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\(.*?\)/g,"").replace(/[^a-z0-9]+/g," ").trim()}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function tinta(t){return hash(norm(t))%360}
function sfondo(t){var h=tinta(t);return "linear-gradient(160deg,hsl("+h+" 70% 42%),hsl("+((h+50)%360)+" 75% 26%))"}
function corpo(t){var p=t.split(/\s+/),l=Math.max.apply(null,p.map(function(x){return x.length}));return Math.max(8,Math.min(24,84/(l*.62),Math.sqrt(3400/(t.length*.62)))).toFixed(1)}

function jsonp(url,ms){return new Promise(function(ok,ko){
  var cb="__lr"+Date.now()+(uid++),s=document.createElement("script"),t=setTimeout(function(){fine();ko(new Error("timeout"))},ms||6000);
  function fine(){clearTimeout(t);try{delete window[cb]}catch(e){window[cb]=undefined}s.remove()}
  window[cb]=function(d){fine();ok(d)};s.onerror=function(){fine();ko(new Error("rete"))};
  s.src=url+(url.indexOf("?")<0?"?":"&")+"callback="+cb;document.head.appendChild(s)})}
function itunes(q){
  return jsonp("https://itunes.apple.com/search?media=movie&entity=movie&country=IT&lang=it_it&limit=4&term="+encodeURIComponent(q)).then(function(d){
    return (d.results||[]).filter(function(r){return r.artworkUrl100}).map(function(r){
      return {t:String(r.trackName||"").replace(/\s*\(.*?\)\s*/g," ").trim(),img:r.artworkUrl100.replace(/\/\d+x\d+bb\./,"/400x600bb."),k:1}})})}
function wiki(lang,q){
  return jsonp("https://"+lang+".wikipedia.org/w/api.php?action=query&format=json&generator=search&gsrlimit=4&gsrenablerewrites=1&gsrsearch="+encodeURIComponent(q+" film")+
    "&prop=pageimages&piprop=thumbnail&pithumbsize=500&pilicense=any").then(function(d){
    var p=(d.query&&d.query.pages)||{};
    return Object.keys(p).map(function(k){return p[k]}).sort(function(a,b){return a.index-b.index}).map(function(x){
      var th=x.thumbnail,ok=th&&th.height>=th.width*1.25,src=ok?th.source:"";
      return {raw:x.title,t:x.title.replace(/\s*\(.*?\)\s*/g," ").trim(),img:src,k:src&&/\/wikipedia\/(en|it)\//.test(src)?0:2}})})}
function lev(a,b){var m=a.length,n=b.length,r=[],i,j;for(j=0;j<=n;j++)r[j]=j;
  for(i=1;i<=m;i++){var prev=r[0];r[0]=i;for(j=1;j<=n;j++){var t=r[j];r[j]=Math.min(r[j]+1,r[j-1]+1,prev+(a.charAt(i-1)===b.charAt(j-1)?0:1));prev=t}}return r[n]}
function sim(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;if(a===b)return 1;if(a.indexOf(b)===0||b.indexOf(a)===0)return .85;return 1-lev(a,b)/Math.max(a.length,b.length)}

/* ---------- pixel ---------- */
function ritaglio(img,r){var iw=img.naturalWidth,ih=img.naturalHeight,sw=iw,sh=ih,sx=0,sy=0;if(iw/ih>r){sw=ih*r;sx=(iw-sw)/2}else{sh=iw/r;sy=(ih-sh)/2}return [sx,sy,sw,sh]}
function pronta(img){return img&&img.isConnected&&img.complete&&img.naturalWidth>0}
function attendi(img){return new Promise(function(ok){if(!img||!img.isConnected||img.complete)return ok();var t=setTimeout(ok,900);
  img.addEventListener("load",function(){clearTimeout(t);ok()},{once:true});img.addEventListener("error",function(){clearTimeout(t);ok()},{once:true})})}
/* Ridisegna la locandina a gradini di risoluzione: in discesa prima del botto, in salita per il vincitore. */
async function sgrana(el,img,passi,ms,giu){
  await attendi(img);
  var p=el.querySelector(".poster");if(!pronta(img)){await sleep(passi.length*ms);return}
  var c=document.createElement("canvas"),x=c.getContext("2d"),r=ritaglio(img,2/3);p.appendChild(c);
  for(var i=0;i<passi.length;i++){var w=passi[i],h=Math.round(w*1.5);c.width=w;c.height=h;
    try{x.drawImage(img,r[0],r[1],r[2],r[3],0,0,w,h)}catch(e){}
    bip(giu?700-i*110:260+i*90,.07,"square",.06);await sleep(ms)}
  if(!giu)c.remove();
}
var cv=$("fx"),cx=cv.getContext("2d"),pz=[],raf=0,SC=.5,COL=["#ffd23f","#ff4d8d","#4de2ff","#f3f1ff"];
function tela(){cv.width=Math.ceil(innerWidth*SC);cv.height=Math.ceil(innerHeight*SC);cx.imageSmoothingEnabled=false}

/* La locandina va in ~2400 frammenti con i suoi stessi colori, ridotti a tavolozza da console. */
function esplodi(q,img,titolo,veloce){
  var cols=calmo?12:(veloce?28:40),rows=Math.round(cols*1.5),dati=null;
  if(pronta(img)){try{var c=document.createElement("canvas");c.width=cols;c.height=rows;var x=c.getContext("2d",{willReadFrequently:true}),r=ritaglio(img,2/3);
    x.drawImage(img,r[0],r[1],r[2],r[3],0,0,cols,rows);dati=x.getImageData(0,0,cols,rows).data}catch(e){dati=null}}
  var h=tinta(titolo||""),cw=q.width/cols,ch=q.height/rows,lato=Math.max(4,cw*1.7),mx=q.left+q.width/2,my=q.top+q.height/2;
  for(var j=0;j<rows;j++)for(var i=0;i<cols;i++){
    var col;if(dati){var o=(j*cols+i)*4;col="rgb("+(Math.round(dati[o]/51)*51)+","+(Math.round(dati[o+1]/51)*51)+","+(Math.round(dati[o+2]/51)*51)+")"}
    else col="hsl("+((h+rand(60))%360)+" 80% "+(25+rand(5)*10)+"%)";
    var px=q.left+(i+.5)*cw,py=q.top+(j+.5)*ch,dx=px-mx,dy=py-my,d=Math.sqrt(dx*dx+dy*dy)||1,f=3+Math.random()*13;
    pz.push({x:px,y:py,vx:dx/d*f+(Math.random()-.5)*4,vy:dy/d*f-3-Math.random()*5,s:lato*(.7+Math.random()*.9),c:col,l:1,k:.006+Math.random()*.012,b:1})}
  if(!raf)raf=requestAnimationFrame(passo);
  return !!dati;
}
function coriandoli(x,y,n){for(var i=0;i<n;i++){var a=Math.random()*6.283,v=3+Math.random()*9;
  pz.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,s:6+rand(3)*4,c:COL[rand(COL.length)],l:1,k:.012,b:0})}
  if(!raf)raf=requestAnimationFrame(passo)}
function passo(){
  var W=innerWidth,H=innerHeight,resto=[];cx.clearRect(0,0,cv.width,cv.height);
  for(var i=0;i<pz.length;i++){var p=pz[i];p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.l-=p.k;
    if(p.b&&p.y>H-4&&p.vy>0){p.y=H-4;p.vy*=-.45;p.vx*=.7;p.b--}
    if(p.l<=0||p.y>H+30||p.x<-30||p.x>W+30)continue;resto.push(p);
    var s=Math.max(2,Math.round(p.s*SC*(p.l<.3?p.l/.3:1)));cx.fillStyle=p.c;cx.fillRect(Math.round(p.x*SC-s/2),Math.round(p.y*SC-s/2),s,s)}
  pz=resto;raf=pz.length?requestAnimationFrame(passo):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}

/* ---------- suoni ---------- */
var ac=null,rumore=null;
function audio(){if(!suoni)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){ac=null}}
function bip(f,d,tipo,vol,quando,fine){
  if(!ac||!suoni)return;
  try{var t=ac.currentTime+(quando||0),o=ac.createOscillator(),g=ac.createGain();o.type=tipo||"square";o.frequency.setValueAtTime(f,t);
    if(fine)o.frequency.exponentialRampToValueAtTime(fine,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.08,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}

    g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.0001,t+.85);s.connect(g);g.connect(ac.destination);s.start(t)}catch(e){}
  bip(180,.5,"square",.14,0,30);
}
